<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="crossGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Hospital Shield / Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield -->
    <path d="M35 0 C55 0 68 10 70 32 C70 54 48 70 35 74 C22 70 0 54 0 32 C2 10 15 0 35 0 Z" fill="url(#shieldGradDark)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Inner Accent Rim -->
    <path d="M35 4 C51 4 64 12 66 32 C66 50 46 65 35 69 C24 65 4 50 4 32 C6 12 19 4 35 4 Z" fill="none" stroke="#fff200" stroke-width="1.8" opacity="0.9" />
    
    <!-- Red Cross Symbol -->
    <g transform="translate(35, 33)">
      <rect x="-6" y="-18" width="12" height="36" rx="2" fill="url(#crossGradDark)" stroke="#ffffff" stroke-width="1.5" />
      <rect x="-18" y="-6" width="36" height="12" rx="2" fill="url(#crossGradDark)" stroke="#ffffff" stroke-width="1.5" />
      <!-- Golden central pulse dot -->
      <circle cx="0" cy="0" r="2.5" fill="#fff200" />
    </g>
  </g>

  <!-- Typography -->
  <!-- "MP HOSPITAL" -->
  <text x="92" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">
    MP <tspan fill="#ef4444">HOSPITAL</tspan>
  </text>

  <!-- "& TRAUMA CENTRE" Pill / Badge -->
  <rect x="92" y="47" width="186" height="19" rx="4" fill="#fff200" />
  <text x="98" y="61" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#0f172a" letter-spacing="1.5">
    &amp; TRAUMA CENTRE
  </text>

  <!-- Formerly Maxx Hospital line -->
  <text x="92" y="79" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#cbd5e1" letter-spacing="0.3">
    (Formerly Maxx Hospital) • Jabalpur
  </text>
</svg>

